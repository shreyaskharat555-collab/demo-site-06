<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Srushti Marriage Bureau | Protestant Christian Matrimony</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--n:#10263b;--g:#b9893e;--c:#faf7f1;--w:#fffdf9;--i:#29251f;--m:#766e65;--l:#e6ddd1}
*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font-family:Georgia,serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{height:76px;background:#fffdf9f5;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:20}.logo{font-size:25px;font-weight:bold;color:var(--n);line-height:.9}.logo small{display:block;font:9px Arial;letter-spacing:3px;color:var(--g);margin-top:7px}.nav{display:flex;gap:8px}
.btn{border:0;border-radius:999px;padding:12px 19px;background:var(--n);color:white;font-weight:bold}.gold{background:var(--g)!important;color:#21170d!important}.light{background:white!important;color:var(--n)!important;border:1px solid #d8cec1!important}.ghost{background:transparent!important;color:var(--n)!important}.full{width:100%}
.hero{min-height:calc(100vh - 76px);display:grid;place-items:center;text-align:center;padding:60px 20px;position:relative;overflow:hidden;background:radial-gradient(circle at 12% 20%,#ead8d2,transparent 31%),radial-gradient(circle at 88% 80%,#dfe7eb,transparent 34%),linear-gradient(135deg,#fffaf4,#f0e8df)}.hero:before{content:"✝";position:absolute;top:10%;left:8%;font-size:110px;color:#fff6}.hero h1{font-size:clamp(46px,7vw,86px);line-height:.96;color:var(--n);margin:18px 0}.hero p{max-width:770px;margin:0 auto 30px;font:17px/1.75 Arial;color:#625b53}.eyebrow{font:10px Arial;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--g)}.verse{margin-top:28px;color:#756b61;font-style:italic}.fade{animation:fade 1s}.rise{animation:rise .9s .12s both}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.page,.dashboard{min-height:calc(100vh - 76px);padding:40px 5%;background:linear-gradient(145deg,#f4ede6,#fffdf9)}.panel{width:min(1050px,100%);margin:auto;background:var(--w);border:1px solid var(--l);border-radius:26px;padding:30px;box-shadow:0 18px 60px #1f19110f}.narrow{max-width:570px}.panel h1{color:var(--n);font-size:36px;margin:6px 0 10px}.sub,.meta{font:14px/1.65 Arial;color:var(--m)}.field{margin:15px 0}.field label{display:block;font:10px Arial;font-weight:bold;letter-spacing:1.3px;text-transform:uppercase;color:#696158;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid #d8cfc3;border-radius:12px;background:#fff;outline:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.msg{font:13px Arial;margin:12px 0}.error{color:#a43d3d}.success{color:#276348}.setup,.pricebox{background:#fff8ec;border:1px solid #ead9bd;border-left:4px solid var(--g);border-radius:14px;padding:14px;font:13px/1.6 Arial;margin:0 0 20px}.pricebox{border-left:1px solid #ead9bd}.price{font-size:36px;font-weight:bold;color:var(--n)}
.back{border:0;background:none;color:var(--n);font-weight:bold;padding:4px 0;margin-bottom:14px}.back:hover{text-decoration:underline}
.dashhead{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.dashhead h1{margin:5px 0;color:var(--n);font-size:38px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--l);border-radius:16px;padding:13px 18px}.stat b{display:block;font-size:24px;color:var(--n)}.stat span{font:11px Arial;color:var(--m)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--l);padding:13px;border-radius:17px;margin-bottom:25px}.toolbar input,.toolbar select{padding:11px;border:1px solid #d8cfc3;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.candidate{background:#fff;border:1px solid var(--l);border-radius:22px;overflow:hidden;box-shadow:0 12px 35px #2a1c0d0a}.portrait,.bigportrait{display:grid;place-items:center;background:linear-gradient(135deg,#d7c2b8,#eee1da);color:white}.portrait{height:225px;font-size:66px}.body{padding:18px}.body h3{margin:0 0 7px;color:var(--n);font-size:22px}.pills span{display:inline-block;background:#f3ece3;border-radius:999px;padding:5px 8px;font:10px Arial;margin:5px 3px 0 0}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.empty{background:#fff;border:1px dashed #cfc3b5;padding:40px;border-radius:18px;text-align:center;grid-column:1/-1}
.profilegrid{display:grid;grid-template-columns:290px 1fr;gap:25px}.bigportrait{height:330px;border-radius:22px;font-size:95px}.section{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin-top:15px}.section h3{margin-top:0;color:var(--n)}.kv{display:grid;grid-template-columns:150px 1fr;gap:9px;font:13px Arial}.kv b{color:#655d54}
.modal{position:fixed;inset:0;background:#071827b8;display:grid;place-items:center;padding:20px;z-index:50}.modalbox{width:min(560px,100%);background:var(--w);border-radius:24px;padding:27px;max-height:90vh;overflow:auto}.close{float:right;border:0;background:none;font-size:28px;color:var(--m)}.footer{text-align:center;padding:30px;color:#8a8075;font:11px Arial}
@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.profilegrid{grid-template-columns:1fr}.bigportrait{height:260px}}@media(max-width:620px){header{height:auto;min-height:76px;padding:12px 5%}.grid2,.cards{grid-template-columns:1fr}.dashhead{display:block}.hero h1{font-size:51px}.panel{padding:22px}}
</style></head><body><div id="root"></div><div id="modal" class="modal" style="display:none"></div>
<script>
const SUPABASE_URL="https://ysgjmieaycfueqcjhgaq.supabase.co",KEY="sb_publishable_t5k4f2k44MeHfbbq1mHoLg_m1L-ZiUE";
const sb=supabase.createClient(SUPABASE_URL,KEY);let user=null,profile=null,likes=new Set(),previous="landing",current=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function header(auth=false){return `<header><div class="logo">Srushti<small>Marriage Bureau</small></div><div class="nav">${auth?`<button class="btn ghost" onclick="showDashboard('matches')">Matches</button><button class="btn ghost" onclick="showDashboard('likes')">♥ Likes</button><button class="btn light" onclick="showBiodata()">My Profile</button><button class="btn" onclick="logout()">Logout</button>`:`<button class="btn light" onclick="showLogin()">Login</button><button class="btn" onclick="showSignup()">Sign Up</button>`}</div></header>`}
function back(){if(previous==="landing")landing();else if(previous==="login")showLogin();else if(previous==="signup")showSignup();else showDashboard()}
function backButton(){return `<button class="back" onclick="back()">← Go back</button>`}
function landing(){previous="landing";root.innerHTML=header()+`<section class="hero"><div><div class="eyebrow fade">Faith • Family • Forever</div><h1 class="rise">Welcome To<br>Srushti Marriage Bureau</h1><p class="rise">A refined Protestant Christian matrimonial community for believers seeking a Christ-centered marriage, meaningful compatibility and family blessing.</p><button class="btn gold" onclick="showSignup()">Begin Your Journey</button> <button class="btn light" onclick="showLogin()">Member Login</button><div class="verse">“Therefore what God has joined together, let no one separate.” — Mark 10:9</div></div></section><div class="footer">© ${new Date().getFullYear()} Srushti Marriage Bureau · Faith • Family • Forever</div>`}
function showLogin(){previous="login";root.innerHTML=header()+`<main class="page"><form class="panel narrow" onsubmit="login(event)">${backButton()}<div class="eyebrow">Welcome back</div><h1>Member Login</h1><p class="sub">Secure sign-in through Supabase.</p><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><div id="msg"></div><button class="btn full">Login</button><p class="sub" style="text-align:center">New here? <a href="#" onclick="showSignup();return false">Create an account</a></p></form></main>`}
function showSignup(){previous="signup";root.innerHTML=header()+`<main class="page"><form class="panel narrow" onsubmit="signup(event)">${backButton()}<div class="eyebrow">A blessed beginning</div><h1>Create your account</h1><p class="sub">Join a serious Christian matrimonial community.</p><div class="field"><label>Full name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" required></div><div class="field"><label>Age confirmation</label><select id="ageconfirm" required><option value="">Choose</option><option>Yes, I am 18 or older</option></select></div><div id="msg"></div><button class="btn gold full">Create Account</button><p class="sub" style="text-align:center">Already a member? <a href="#" onclick="showLogin();return false">Login</a></p></form></main>`}
function message(t,ok=false){let x=document.getElementById("msg");if(x){x.className="msg "+(ok?"success":"error");x.textContent=t}}
async function signup(e){e.preventDefault();let name=$("name").value.trim(),email=$("email").value.trim(),password=$("password").value;let r=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});if(r.error)return message(r.error.message);user=r.data.user;profile={id:user.id,email,full_name:name,paid:true};let s=await saveProfile();if(s.error)return message(s.error.message);if(r.data.session)showBiodata();else{showLogin();setTimeout(()=>message("Account created. Check your email if confirmation is enabled, then log in.",true),50)}}
async function login(e){e.preventDefault();let r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)return message(r.error.message);user=r.data.user;await loadProfile();if(profile)showDashboard("matches");else showBiodata()}
async function saveProfile(){return await sb.from("profiles").upsert(profile).select().single()}
async function loadProfile(){let r=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();if(!r.error)profile=r.data}
function showBiodata(){previous="profile";let p=profile||{};root.innerHTML=header(true)+`<main class="page"><form class="panel" onsubmit="saveBiodata(event)">${backButton()}<div class="eyebrow">Your story</div><h1>Christian biodata</h1><p class="sub">Complete your profile so compatible members can discover you.</p><div class="grid2">${field("Full name","full_name",p.full_name,"text",true)}${select("Gender","gender",["Male","Female"],p.gender)}${field("Age","age",p.age||25,"number",true)}${field("City","city",p.city,"text",true)}${field("Church","church",p.church)}${field("Denomination","denomination",p.denomination||"Protestant")}${field("Education","education",p.education)}${field("Profession","profession",p.profession)}</div>${area("About you","bio",p.bio)}<h2 style="color:var(--n)">Partner preferences</h2><div class="grid2">${select("Preferred gender","preferred_gender",["Male","Female"],p.preferred_gender)}${field("Preferred city","preferred_city",p.preferred_city||"Any")}${field("Minimum age","preferred_min_age",p.preferred_min_age||18,"number")}${field("Maximum age","preferred_max_age",p.preferred_max_age||70,"number")}</div><div class="pricebox"><div class="eyebrow">Registration</div><div class="price">₹2,999</div><span style="font:12px Arial;color:var(--m)">Razorpay is intentionally not blocking candidates yet. Payment will be added later.</span></div><div id="msg"></div><button class="btn gold full">Save Biodata & Continue</button></form></main>`}
function field(l,id,v="",type="text",req=false){return `<div class="field"><label>${l}</label><input id="${id}" type="${type}" value="${esc(v)}" ${req?"required":""}></div>`}
function area(l,id,v=""){return `<div class="field"><label>${l}</label><textarea id="${id}" rows="5">${esc(v)}</textarea></div>`}
function select(l,id,opts,v){return `<div class="field"><label>${l}</label><select id="${id}">${opts.map(o=>`<option ${v===o?"selected":""}>${o}</option>`).join("")}</select></div>`}
async function saveBiodata(e){e.preventDefault();profile={...profile,id:user.id,email:user.email,full_name:$("full_name").value,gender:$("gender").value,age:+$("age").value,city:$("city").value,church:$("church").value,denomination:$("denomination").value,education:$("education").value,profession:$("profession").value,bio:$("bio").value,preferred_gender:$("preferred_gender").value,preferred_city:$("preferred_city").value||"Any",preferred_min_age:+$("preferred_min_age").value,preferred_max_age:+$("preferred_max_age").value,paid:true};let r=await saveProfile();if(r.error)return message(r.error.message);showDashboard("matches")}
async function loadLikes(){likes=new Set();let r=await sb.from("likes").select("liked_profile_id").eq("user_id",user.id);if(!r.error)(r.data||[]).forEach(x=>likes.add(x.liked_profile_id))}
async function showDashboard(tab="matches"){previous="dashboard";await loadLikes();let r=await sb.from("profiles").select("*").eq("paid",true);let all=r.data||[],p=profile||{};let matches=all.filter(x=>x.id!==user.id&&x.gender===p.preferred_gender&&+x.age>=+(p.preferred_min_age||18)&&+x.age<=+(p.preferred_max_age||100)&&(!p.preferred_city||p.preferred_city.toLowerCase()==="any"||String(x.city||"").toLowerCase().includes(p.preferred_city.toLowerCase())));current=tab==="likes"?all.filter(x=>likes.has(x.id)):matches;root.innerHTML=header(true)+`<main class="dashboard"><div class="dashhead"><div><div class="eyebrow">Srushti Christian Matrimony</div><h1>${tab==="likes"?"Profiles you liked":"Suggested matches"}</h1><p class="sub">Compatibility is based on your matrimonial preferences.</p></div><button class="btn gold" onclick="showBiodata()">Edit Biodata</button></div><div class="stats"><div class="stat"><b>${matches.length}</b><span>Suggested matches</span></div><div class="stat"><b>${likes.size}</b><span>Your likes</span></div></div><div class="toolbar"><input id="search" placeholder="Search name, city, church…" oninput="filter()"><select id="city" onchange="filter()"><option value="">All cities</option>${[...new Set(all.map(x=>x.city).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join("")}</select><select id="ages" onchange="filter()"><option value="">Any age</option><option value="18-25">18–25</option><option value="26-35">26–35</option><option value="36-50">36–50</option></select></div><div id="cards" class="cards">${cards()}</div></main>`}
function cards(){if(!current.length)return `<div class="empty"><h3>No profiles to show</h3><p class="sub">Try broadening your preferences. New Christian members will appear here as they join.</p></div>`;return current.map(c=>`<article class="candidate" data-s="${esc((c.full_name+" "+c.city+" "+c.church+" "+c.profession).toLowerCase())}" data-c="${esc(c.city||"")}" data-a="${c.age}"><div class="portrait">♡</div><div class="body"><h3>${esc(c.full_name)}</h3><div class="meta">${c.age} · ${esc(c.city||"India")} · ${esc(c.profession||"")}<br>${esc(c.church||"Christian fellowship")} · ${esc(c.denomination||"Protestant")}</div><p class="meta">${esc((c.bio||"Faith-centered member seeking a meaningful Christian marriage.").slice(0,150))}</p><div class="pills"><span>Protestant</span><span>Faith-centered</span></div><div class="actions"><button class="btn gold" onclick="toggleLike('${c.id}')">${likes.has(c.id)?"♥ Liked":"♡ Like"}</button><button class="btn light" onclick="view('${c.id}')">View Profile</button></div></div></article>`).join("")}
function filter(){let q=($("search")?.value||"").toLowerCase(),c=$("city")?.value||"",a=$("ages")?.value||"";document.querySelectorAll(".candidate").forEach(x=>{let ok=x.dataset.s.includes(q)&&(!c||x.dataset.c===c);if(a){let[z,y]=a.split("-").map(Number);ok=ok&&+x.dataset.a>=z&&+x.dataset.a<=y}x.style.display=ok?"":"none"})}
async function toggleLike(id){let r;if(likes.has(id)){r=await sb.from("likes").delete().eq("user_id",user.id).eq("liked_profile_id",id);if(!r.error)likes.delete(id)}else{r=await sb.from("likes").insert({user_id:user.id,liked_profile_id:id});if(!r.error)likes.add(id)}if(r.error){alert("Like could not be saved. Make sure schema.sql has been run in Supabase.");return}showDashboard("matches")}
function view(id){let c=current.find(x=>x.id===id);if(!c)return;modal.innerHTML=`<div class="modalbox"><button class="close" onclick="closeModal()">×</button><div class="profilegrid"><div class="bigportrait">♡</div><div><div class="eyebrow">Christian member</div><h2 style="color:var(--n);font-size:34px;margin:7px 0">${esc(c.full_name)}</h2><div class="meta">${c.age} · ${esc(c.city||"")} · ${esc(c.profession||"")}<br>${esc(c.church||"")} · ${esc(c.denomination||"Protestant")}</div><div class="section"><h3>About</h3><p class="meta">${esc(c.bio||"No introduction added yet.")}</p></div><div class="actions"><button class="btn gold" onclick="toggleLike('${c.id}');closeModal()">${likes.has(c.id)?"♥ Liked":"♡ Like"}</button><button class="btn light" onclick="closeModal()">Close</button></div></div></div></div>`;modal.style.display="grid"}
function closeModal(){modal.style.display="none"}async function logout(){await sb.auth.signOut();user=null;profile=null;likes.clear();landing()}
async function boot(){let r=await sb.auth.getSession();if(r.data.session){user=r.data.session.user;await loadProfile();if(profile)showDashboard();else showBiodata()}else landing()}boot();
</script></body></html>
